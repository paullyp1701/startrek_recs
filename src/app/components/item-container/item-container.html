<div class="itemContainer">

  <a href="{{ episodeData?.imdbLink }}" class="desktopDisplay itemImageContainer" target="_blank">
    <div *ngIf="episodeData?.imgSource">
      <img [src]="episodeData?.imgSource" alt="Episode image" />
    </div>
    <div *ngIf="!episodeData?.imgSource">
      <img src="/missing.avif" alt="Episode image" />
    </div>
  </a>

  <div class="itemInfoContainer">
    <h2>{{ episodeData?.title }}</h2>
    <ng-container *ngIf="episodeData.episodeNumber">
      <h3>Season {{ episodeData?.season | number: '2.0' }} | Episode {{ episodeData?.episodeNumber }}</h3>
    </ng-container>
    <ng-container *ngIf="!episodeData.episodeNumber">
      <h3>From {{ episodeData?.seriesName }}</h3>
    </ng-container>

    <!-- <p><b>Description: </b>{{ episodeData?.description }}</p> -->
    <p>{{ episodeData?.description }}</p>

    <a *ngIf="episodeData?.imgSource" href="{{ episodeData?.imdbLink }}" class="mobileDisplay itemImageContainer" target="_blank">
      <div *ngIf="episodeData?.imgSource">
        <img [src]="episodeData?.imgSource" alt="Episode image" />
      </div>
    </a>

    <p>
      <!-- <b>Explanation: </b> -->
      <i>{{ episodeData?.justification }}</i>
    </p>
  </div>

</div>
